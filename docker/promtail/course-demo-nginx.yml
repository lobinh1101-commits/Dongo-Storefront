server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: course_demo_backend
    static_configs:
      - targets: [localhost]
        labels:
          job: backend
          service: backend
          project: dongo-course-demo
          __path__: /var/log/backend/backend.jsonl
    pipeline_stages:
      - json:
          expressions:
            time: time
            level: level
            method: req.method
            path: req.url
            status: res.statusCode
      - labels:
          level:
          method:
          status:
      - timestamp:
          source: time
          format: RFC3339Nano

  - job_name: course_demo_nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: nginx
          project: dongo-course-demo
          __path__: /var/log/nginx/nginx-access.jsonl
    pipeline_stages:
      - json:
          expressions:
            time: time
            method: method
            status: status
            uri: uri
            request_time: request_time
            upstream_status: upstream_status
      - labels:
          method:
          status:
          upstream_status:
      - timestamp:
          source: time
          format: RFC3339Nano
